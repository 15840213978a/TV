name: FongMi TV Android Release

on:
  push:
    branches:
      - fongmi
      - main
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - "website/**"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag，留空自动生成"
        required: false
        type: string
      release_notes:
        description: "Release notes"
        required: false
        type: string
      prerelease:
        description: "Pre-release"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

env:
  TZ: Asia/Shanghai

jobs:
  build:
    name: Build FongMi TV
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout TV
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager "platform-tools" "platforms;android-37.0" "build-tools;37.0.0"

      - name: Checkout FongMi Media
        uses: actions/checkout@v6
        with:
          repository: FongMi/media
          path: fongmi-media
          fetch-depth: 1

      - name: Build FongMi Media AARs
        shell: bash
        run: |
          set -euo pipefail
          cd fongmi-media
          chmod +x ./gradlew

          echo "Discovering release AAR tasks..."
          ./gradlew tasks --all --no-daemon > "$GITHUB_WORKSPACE/media-tasks.txt"

          mapfile -t TASKS < <(
            grep -E '^:[A-Za-z0-9_./:-]+:assembleRelease([[:space:]]|$)' "$GITHUB_WORKSPACE/media-tasks.txt" \
              | awk '{print $1}' \
              | sort -u
          )

          if [ "${#TASKS[@]}" -eq 0 ]; then
            echo "::warning::No module-qualified assembleRelease tasks found; trying root assembleRelease."
            ./gradlew assembleRelease --no-daemon --stacktrace
          else
            printf 'Media release tasks:\n'
            printf '  %s\n' "${TASKS[@]}"
            ./gradlew "${TASKS[@]}" --no-daemon --stacktrace
          fi

          cd "$GITHUB_WORKSPACE"

          mkdir -p app/libs
          find fongmi-media \
            -type f \
            -path "*/build/outputs/aar/*.aar" \
            -print \
            -exec cp -f {} app/libs/ \;

          echo "AAR files now available in app/libs:"
          ls -lh app/libs/*.aar || true

          MEDIA_AAR_COUNT="$(find app/libs -maxdepth 1 -type f -name "*.aar" | wc -l)"
          if [ "$MEDIA_AAR_COUNT" -eq 0 ]; then
            echo "::error::FongMi Media build produced no AAR files."
            exit 1
          fi

      - name: Configure release signing
        shell: bash
        env:
          WEBHTV_SIGNING_KEYSTORE_B64: ${{ secrets.WEBHTV_SIGNING_KEYSTORE_B64 }}
          WEBHTV_SIGNING_STORE_PASSWORD: ${{ secrets.WEBHTV_SIGNING_STORE_PASSWORD }}
          WEBHTV_SIGNING_KEY_ALIAS: ${{ secrets.WEBHTV_SIGNING_KEY_ALIAS }}
          WEBHTV_SIGNING_KEY_PASSWORD: ${{ secrets.WEBHTV_SIGNING_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          if [ -z "${WEBHTV_SIGNING_KEYSTORE_B64:-}" ] || \
             [ -z "${WEBHTV_SIGNING_STORE_PASSWORD:-}" ] || \
             [ -z "${WEBHTV_SIGNING_KEY_ALIAS:-}" ]; then
            echo "::error::Missing signing secrets."
            exit 1
          fi

          mkdir -p app/signing
          printf '%s' "$WEBHTV_SIGNING_KEYSTORE_B64" | base64 --decode > app/signing/release.jks

          KEY_PASS="${WEBHTV_SIGNING_KEY_PASSWORD:-$WEBHTV_SIGNING_STORE_PASSWORD}"

          keytool -list \
            -keystore app/signing/release.jks \
            -storepass "$WEBHTV_SIGNING_STORE_PASSWORD" \
            -alias "$WEBHTV_SIGNING_KEY_ALIAS" >/dev/null

          cat > local.properties <<EOF
          sdk.dir=$ANDROID_HOME
          storeFile=$GITHUB_WORKSPACE/app/signing/release.jks
          keyAlias=$WEBHTV_SIGNING_KEY_ALIAS
          storePassword=$WEBHTV_SIGNING_STORE_PASSWORD
          keyPassword=$KEY_PASS
          EOF

          echo "Signing keystore and alias verified."

      - name: Build FongMi TV release APKs
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          rm -rf Release/apk

          ./gradlew \
            :app:assembleMobileRelease \
            :app:assembleLeanbackRelease \
            --no-daemon \
            --stacktrace

      - name: Collect APKs
        shell: bash
        run: |
          set -euo pipefail
          rm -rf dist
          mkdir -p dist

          find Release/apk app/build/outputs/apk \
            -type f -name "*.apk" -print 2>/dev/null \
            | sort -u \
            | while read -r apk; do
                cp -f "$apk" "dist/$(basename "$apk")"
              done

          if ! compgen -G "dist/*.apk" >/dev/null; then
            echo "::error::No APK files found."
            exit 1
          fi

          ls -lh dist/

      - name: Resolve release metadata
        id: meta
        shell: bash
        run: |
          set -euo pipefail

          VERSION_NAME="$(sed -n 's/^[[:space:]]*versionName[[:space:]]*"\([^"]*\)".*/\1/p' app/build.gradle | head -1)"

          if [ -z "$VERSION_NAME" ]; then
            VERSION_NAME="unknown"
          fi

          TAG="${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || '' }}"
          if [ -z "$TAG" ]; then
            TAG="v${VERSION_NAME}-$(date +%Y%m%d%H%M)"
          fi

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "title=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_NOTES: ${{ github.event_name == 'workflow_dispatch' && inputs.release_notes || '' }}
        run: |
          set -euo pipefail

          TAG="${{ steps.meta.outputs.tag }}"
          TITLE="${{ steps.meta.outputs.title }}"
          NOTES="${RELEASE_NOTES:-FongMi TV 自动构建发布。}"

          FLAG=""
          if [ "${{ github.event_name == 'workflow_dispatch' && inputs.prerelease || false }}" = "true" ]; then
            FLAG="--prerelease"
          fi

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/*.apk --clobber
          else
            gh release create "$TAG" \
              --target "$GITHUB_SHA" \
              --title "$TITLE" \
              --notes "$NOTES" \
              $FLAG \
              dist/*.apk
          fi

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: FongMi-TV-${{ steps.meta.outputs.tag }}
          path: dist/*.apk
          if-no-files-found: error
          retention-days: 30
