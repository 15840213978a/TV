name: FongMi TV Build With FongMi Media

on:
  push:
    branches:
      - main
      - fongmi
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag，留空自动生成"
        required: false
        type: string
      release_notes:
        description: "Release notes"
        required: false
        type: string
      prerelease:
        description: "Pre-release"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

env:
  TZ: Asia/Shanghai

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout TV
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android packages
        run: |
          sdkmanager "platform-tools" "platforms;android-37" "build-tools;37.0.0"

      - name: Checkout FongMi media fork
        uses: actions/checkout@v6
        with:
          repository: FongMi/media
          ref: release
          path: .deps/media
          fetch-depth: 1

      - name: Wire FongMi Media3 source into TV
        shell: bash
        run: |
          set -euo pipefail

          cp settings.gradle settings.gradle.original
          cp app/build.gradle app/build.gradle.original

          python3 - <<'PY'
          from pathlib import Path

          settings = Path("settings.gradle")
          text = settings.read_text(encoding="utf-8")

          hook = """
// ===== FongMi Media3 local source =====
gradle.ext.androidxMediaModulePrefix = 'media3-'
apply from: file('.deps/media/core_settings.gradle')
// ===== end FongMi Media3 local source =====

"""
          if "androidxMediaModulePrefix" not in text:
              text = hook + text
              settings.write_text(text, encoding="utf-8")

          build = Path("app/build.gradle")
          text = build.read_text(encoding="utf-8")

          deps = """
    // ===== FongMi Media3 local modules =====
    implementation project(':media3-lib-common')
    implementation project(':media3-lib-container')
    implementation project(':media3-lib-database')
    implementation project(':media3-lib-datasource')
    implementation project(':media3-lib-datasource-okhttp')
    implementation project(':media3-lib-decoder')
    implementation project(':media3-lib-effect')
    implementation project(':media3-lib-exoplayer')
    implementation project(':media3-lib-exoplayer-dash')
    implementation project(':media3-lib-exoplayer-hls')
    implementation project(':media3-lib-exoplayer-rtsp')
    implementation project(':media3-lib-exoplayer-smoothstreaming')
    implementation project(':media3-lib-extractor')
    implementation project(':media3-lib-session')
    implementation project(':media3-lib-ui')
    // ===== end FongMi Media3 local modules =====
"""

          marker = "dependencies {"
          if "media3-lib-common" not in text:
              text = text.replace(marker, marker + "\n" + deps, 1)
              build.write_text(text, encoding="utf-8")
          PY

          echo "===== settings.gradle Media3 hook ====="
          grep -n -A3 -B2 "androidxMediaModulePrefix" settings.gradle || true

          echo "===== app/build.gradle Media3 deps ====="
          grep -n "media3-lib-" app/build.gradle || true

      - name: Verify Media3 projects
        run: |
          chmod +x ./gradlew
          ./gradlew projects --no-daemon | tee gradle-projects.txt
          grep "media3-lib-common" gradle-projects.txt
          grep "media3-lib-exoplayer" gradle-projects.txt
          grep "media3-lib-ui" gradle-projects.txt

      - name: Configure signing
        shell: bash
        env:
          WEBHTV_SIGNING_KEYSTORE_B64: ${{ secrets.WEBHTV_SIGNING_KEYSTORE_B64 }}
          WEBHTV_SIGNING_STORE_PASSWORD: ${{ secrets.WEBHTV_SIGNING_STORE_PASSWORD }}
          WEBHTV_SIGNING_KEY_ALIAS: ${{ secrets.WEBHTV_SIGNING_KEY_ALIAS }}
          WEBHTV_SIGNING_KEY_PASSWORD: ${{ secrets.WEBHTV_SIGNING_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "${WEBHTV_SIGNING_KEYSTORE_B64:-}"
          test -n "${WEBHTV_SIGNING_STORE_PASSWORD:-}"
          test -n "${WEBHTV_SIGNING_KEY_ALIAS:-}"

          mkdir -p app/signing
          printf '%s' "$WEBHTV_SIGNING_KEYSTORE_B64" | base64 --decode > app/signing/release.jks

          keytool -list \
            -keystore app/signing/release.jks \
            -storepass "$WEBHTV_SIGNING_STORE_PASSWORD" \
            -alias "$WEBHTV_SIGNING_KEY_ALIAS" >/dev/null

          KEY_PASS="${WEBHTV_SIGNING_KEY_PASSWORD:-$WEBHTV_SIGNING_STORE_PASSWORD}"

          cat > local.properties <<EOF
          storeFile=$GITHUB_WORKSPACE/app/signing/release.jks
          keyAlias=$WEBHTV_SIGNING_KEY_ALIAS
          storePassword=$WEBHTV_SIGNING_STORE_PASSWORD
          keyPassword=$KEY_PASS
          EOF

      - name: Compile check
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew :app:compileMobileArm64_v8aDebugJavaWithJavac --no-daemon --stacktrace

      - name: Build FongMi APKs
        shell: bash
        run: |
          set -euo pipefail
          rm -rf Release/apk
          ./gradlew \
            :app:assembleMobileRelease \
            :app:assembleLeanbackRelease \
            --no-daemon \
            --stacktrace

      - name: Collect APKs
        shell: bash
        run: |
          set -euo pipefail
          rm -rf dist
          mkdir -p dist

          find Release/apk app/build/outputs/apk \
            -type f -name "*.apk" -print 2>/dev/null | sort -u | while read -r apk; do
              cp "$apk" "dist/$(basename "$apk")"
          done

          if ! compgen -G "dist/*.apk" >/dev/null; then
            echo "::error::No APK found"
            exit 1
          fi

          ls -lh dist/

      - name: Resolve release metadata
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          VERSION_NAME="$(sed -n 's/^[[:space:]]*versionName[[:space:]]*"\([^"]*\)".*/\1/p' app/build.gradle.original | head -1)"
          TAG="${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || '' }}"
          if [ -z "$TAG" ]; then
            TAG="v${VERSION_NAME}-$(date +%Y%m%d%H%M)"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "title=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_NOTES: ${{ github.event_name == 'workflow_dispatch' && inputs.release_notes || '' }}
        run: |
          set -euo pipefail
          TAG="${{ steps.meta.outputs.tag }}"
          TITLE="${{ steps.meta.outputs.title }}"
          NOTES="${RELEASE_NOTES:-FongMi TV + FongMi Media3 源码构建。}"

          FLAG=""
          if [ "${{ github.event_name == 'workflow_dispatch' && inputs.prerelease || false }}" = "true" ]; then
            FLAG="--prerelease"
          fi

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/*.apk --clobber
          else
            gh release create "$TAG" \
              --target "$GITHUB_SHA" \
              --title "$TITLE" \
              --notes "$NOTES" \
              $FLAG \
              dist/*.apk
          fi

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: FongMi-TV-${{ steps.meta.outputs.tag }}
          path: dist/*.apk
          if-no-files-found: error
          retention-days: 30
