name: FongMi TV Four-Repo Build

on:
  push:
    branches:
      - fongmi
      - main
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - "website/**"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag，留空自动生成"
        required: false
        type: string
      release_notes:
        description: "Release notes"
        required: false
        type: string
      prerelease:
        description: "Pre-release"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

env:
  TZ: Asia/Shanghai

jobs:
  build:
    name: Build FongMi TV
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout TV
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Checkout FongMi media
        uses: actions/checkout@v6
        with:
          repository: FongMi/media
          ref: release
          path: .deps/media
          fetch-depth: 1

      - name: Checkout FongMi mpv-android
        uses: actions/checkout@v6
        with:
          repository: FongMi/mpv-android
          path: .deps/mpv-android
          fetch-depth: 1

      - name: Checkout FongMi mpv
        uses: actions/checkout@v6
        with:
          repository: FongMi/mpv
          path: .deps/mpv
          fetch-depth: 1

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager "platform-tools" "platforms;android-37.0" "build-tools;37.0.0"

      - name: Verify FongMi media integration
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ./gradlew

          test -f .deps/media/core_settings.gradle

          echo "===== Required class source discovery ====="
          for key in MediaChapter MediaEdition PlayerSeekView DanmakuConfig LibassPlaybackSession MpvPlayer; do
            echo "--- $key ---"
            grep -R --include='*.java' --include='*.kt' -n "$key" .deps/media .deps/mpv-android 2>/dev/null | head -20 || true
          done

          echo "===== Gradle Media3 projects ====="
          ./gradlew projects --no-daemon > build-projects.txt
          grep -E "media3|mpv|libass|danmaku" build-projects.txt || true

          # 这些基础模块必须存在，否则说明 media 没有接入成功。
          grep -q "media3-lib-common" build-projects.txt
          grep -q "media3-lib-exoplayer" build-projects.txt
          grep -q "media3-lib-ui" build-projects.txt

      - name: Configure release signing
        shell: bash
        env:
          WEBHTV_SIGNING_KEYSTORE_B64: ${{ secrets.WEBHTV_SIGNING_KEYSTORE_B64 }}
          WEBHTV_SIGNING_STORE_PASSWORD: ${{ secrets.WEBHTV_SIGNING_STORE_PASSWORD }}
          WEBHTV_SIGNING_KEY_ALIAS: ${{ secrets.WEBHTV_SIGNING_KEY_ALIAS }}
          WEBHTV_SIGNING_KEY_PASSWORD: ${{ secrets.WEBHTV_SIGNING_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          if [ -z "${WEBHTV_SIGNING_KEYSTORE_B64:-}" ] || \
             [ -z "${WEBHTV_SIGNING_STORE_PASSWORD:-}" ] || \
             [ -z "${WEBHTV_SIGNING_KEY_ALIAS:-}" ]; then
            echo "::error::Missing signing secrets."
            exit 1
          fi

          mkdir -p app/signing
          printf '%s' "$WEBHTV_SIGNING_KEYSTORE_B64" | base64 --decode > app/signing/release.jks

          KEY_PASS="${WEBHTV_SIGNING_KEY_PASSWORD:-$WEBHTV_SIGNING_STORE_PASSWORD}"

          keytool -list \
            -keystore app/signing/release.jks \
            -storepass "$WEBHTV_SIGNING_STORE_PASSWORD" \
            -alias "$WEBHTV_SIGNING_KEY_ALIAS" >/dev/null

          cat > local.properties <<EOF
          sdk.dir=$ANDROID_HOME
          storeFile=$GITHUB_WORKSPACE/app/signing/release.jks
          keyAlias=$WEBHTV_SIGNING_KEY_ALIAS
          storePassword=$WEBHTV_SIGNING_STORE_PASSWORD
          keyPassword=$KEY_PASS
          EOF

      - name: Build FongMi TV release APKs
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          rm -rf Release/apk

          ./gradlew \
            :app:assembleMobileRelease \
            :app:assembleLeanbackRelease \
            --no-daemon \
            --stacktrace

      - name: Collect APKs
        shell: bash
        run: |
          set -euo pipefail
          rm -rf dist
          mkdir -p dist

          find Release/apk app/build/outputs/apk \
            -type f -name "*.apk" -print 2>/dev/null \
            | sort -u \
            | while read -r apk; do
                cp -f "$apk" "dist/$(basename "$apk")"
              done

          if ! compgen -G "dist/*.apk" >/dev/null; then
            echo "::error::No APK files found."
            exit 1
          fi

          ls -lh dist/

      - name: Resolve release metadata
        id: meta
        shell: bash
        run: |
          set -euo pipefail

          VERSION_NAME="$(sed -n 's/^[[:space:]]*versionName[[:space:]]*"\([^"]*\)".*/\1/p' app/build.gradle | head -1)"
          if [ -z "$VERSION_NAME" ]; then
            VERSION_NAME="unknown"
          fi

          TAG="${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || '' }}"
          if [ -z "$TAG" ]; then
            TAG="v${VERSION_NAME}-$(date +%Y%m%d%H%M)"
          fi

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "title=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_NOTES: ${{ github.event_name == 'workflow_dispatch' && inputs.release_notes || '' }}
        run: |
          set -euo pipefail

          TAG="${{ steps.meta.outputs.tag }}"
          TITLE="${{ steps.meta.outputs.title }}"
          NOTES="${RELEASE_NOTES:-FongMi TV 四仓联动自动构建。}"

          FLAG=""
          if [ "${{ github.event_name == 'workflow_dispatch' && inputs.prerelease || false }}" = "true" ]; then
            FLAG="--prerelease"
          fi

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/*.apk --clobber
          else
            gh release create "$TAG" \
              --target "$GITHUB_SHA" \
              --title "$TITLE" \
              --notes "$NOTES" \
              $FLAG \
              dist/*.apk
          fi

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: FongMi-TV-${{ steps.meta.outputs.tag }}
          path: dist/*.apk
          if-no-files-found: error
          retention-days: 30
