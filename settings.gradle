pluginManagement {
    repositories {
        gradlePluginPortal()
        mavenCentral()
        google()
    }
}

plugins {
    id "org.gradle.toolchains.foojay-resolver-convention" version "1.0.0"
}

dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        mavenCentral()
        google()
        flatDir { dirs "$rootDir/app/libs" }
        maven { url = "https://jitpack.io" }
    }
}

// FongMi/media 本地源码接入。
// GitHub Actions 会把 FongMi/media checkout 到 .deps/media。
def fongMiMediaSettings = file(".deps/media/core_settings.gradle")
if (fongMiMediaSettings.exists()) {
    gradle.ext.androidxMediaModulePrefix = "media3-"
    apply from: fongMiMediaSettings
}

include ':app'
include ':catvod'
include ':chaquo'
include ':quickjs'
rootProject.name = "TV"
